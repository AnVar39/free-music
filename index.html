<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свободная музыка</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2447f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Музыка">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef0f2;--ink:#14202b;--mute:#667482;--line:#cfd6dc;--card:#fff;--acc:#2447f5;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e8edf1;--mute:#8d9aa6;--line:#26323c;--card:#18222b;--acc:#7b94ff;--accink:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 150px}
h1{font-size:2rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 22px;max-width:56ch}
form{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit}
input[type=search]{flex:1 1 220px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.go{padding:12px 20px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#status{margin:18px 0 8px;color:var(--mute)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.item h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;text-decoration:none;color:inherit;font-size:.92rem}
.btn.best{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
.files{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.file{padding:9px 0;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.file .t{overflow-wrap:anywhere}
.file .row{margin-top:6px}
.lic{font-size:.8rem;color:var(--mute)}
#inst{margin:0 0 14px}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px max(10px,env(safe-area-inset-bottom));display:none}
#player div{max-width:760px;margin:0 auto}
#player audio{width:100%}
#pt{font-size:.85rem;color:var(--mute);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.92rem;display:none;z-index:5}
</style>
</head>
<body>
<main>
<h1>Свободная музыка</h1>
<p class="sub">Поиск по Internet Archive: только треки с лицензией Creative Commons или в общественном достоянии — их можно скачивать легально и бесплатно.</p>
<button id="inst" class="btn" type="button" hidden>Установить приложение</button>

<form id="f">
  <input type="search" id="q" placeholder="Исполнитель, альбом или жанр" aria-label="Поиск" required>
  <select id="fmt" aria-label="Качество">
    <option value="any">Любое качество</option>
    <option value="lossless">Только без потерь (FLAC)</option>
    <option value="hq">MP3 от 256 кбит/с и выше</option>
  </select>
  <button class="go" type="submit">Найти</button>
</form>

<div id="status" aria-live="polite">Введите запрос, например «jazz» или «ambient».</div>
<div id="list"></div>
</main>

<div id="toast" role="status"></div>
<div id="player"><div><div id="pt"></div><audio id="au" controls></audio></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNative=()=>!!(window.Capacitor&&typeof Capacitor.isNativePlatform==='function'&&Capacitor.isNativePlatform());

// Ранг качества: чем больше, тем лучше
const RANK={'24bit Flac':110,'Flac':100,'WAVE':95,'320Kbps MP3':80,'256Kbps MP3':70,'VBR MP3':65,'Ogg Vorbis':60,'192Kbps MP3':50,'MP3':45,'128Kbps MP3':40,'64Kbps MP3':20};
const LABEL={'24bit Flac':'FLAC 24 бит','Flac':'FLAC','WAVE':'WAV','320Kbps MP3':'MP3 320','256Kbps MP3':'MP3 256','VBR MP3':'MP3 VBR','Ogg Vorbis':'OGG','192Kbps MP3':'MP3 192','MP3':'MP3','128Kbps MP3':'MP3 128','64Kbps MP3':'MP3 64'};
const size=b=>{b=+b;if(!b)return'';return b>1e9?(b/1e9).toFixed(1)+' ГБ':b>1e6?(b/1e6).toFixed(1)+' МБ':Math.round(b/1e3)+' КБ'};
const isFree=u=>[].concat(u||[]).some(x=>/creativecommons\.org|publicdomain/i.test(x));
const licName=u=>/publicdomain|zero/i.test([].concat(u||[]).join(' '))?'Общественное достояние':'Creative Commons';
const url=(id,name)=>`https://archive.org/download/${encodeURIComponent(id)}/${name.split('/').map(encodeURIComponent).join('/')}`;

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4500)}

// Спецсимволы Lucene ломают запрос (ошибка 400) — убираем
const clean=s=>s.replace(/[\\+\-!(){}\[\]^"~*?:\/&|<>=]/g,' ').replace(/\s+/g,' ').trim();

async function run(query,rows){
  const p=new URLSearchParams({q:query,rows:String(rows),output:'json'});
  p.append('sort[]','downloads desc');
  ['identifier','title','creator','licenseurl'].forEach(f=>p.append('fl[]',f));
  const r=await fetch('https://archive.org/advancedsearch.php?'+p);
  if(!r.ok)throw new Error('сервер ответил '+r.status);
  return (await r.json()).response.docs||[];
}

async function search(q,fmt){
  const qq=clean(q);
  if(!qq)throw new Error('введите слова для поиска');
  const extra=fmt==='lossless'?' AND format:Flac':fmt==='hq'?' AND (format:Flac OR format:"320Kbps MP3" OR format:"256Kbps MP3" OR format:"VBR MP3")':'';
  const base=`(${qq}) AND mediatype:audio${extra}`;
  let docs=[];
  try{docs=await run(base+' AND (licenseurl:*creativecommons.org* OR licenseurl:*publicdomain*)',30)}catch(e){docs=[]}
  docs=docs.filter(d=>isFree(d.licenseurl));
  if(!docs.length){ // запасной путь: берём больше и фильтруем по лицензии сами
    docs=(await run(base,100)).filter(d=>isFree(d.licenseurl)).slice(0,30);
  }
  return docs;
}

async function loadTracks(id){
  const r=await fetch('https://archive.org/metadata/'+encodeURIComponent(id));
  if(!r.ok)throw new Error('сервер ответил '+r.status);
  const m=await r.json();
  const map=new Map();
  (m.files||[]).filter(f=>RANK[f.format]).forEach(f=>{
    const key=f.name.replace(/\.[^.\/]+$/,'');
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(f);
  });
  const tracks=[...map.entries()].map(([key,fs])=>{
    fs.sort((a,b)=>RANK[b.format]-RANK[a.format]);
    const title=(fs.find(f=>f.title)||{}).title||key.split('/').pop();
    // для прослушивания берём лёгкий MP3/OGG, если он есть
    const stream=fs.find(f=>/mp3|ogg/i.test(f.format))||fs[0];
    return {key,title,files:fs,stream};
  });
  tracks.sort((a,b)=>a.key.localeCompare(b.key,undefined,{numeric:true}));
  return tracks;
}

function play(id,t){
  $('#player').style.display='block';
  $('#pt').textContent=t.title;
  const a=$('#au');a.src=url(id,t.stream.name);
  a.play().catch(()=>toast('Нажмите ▶ в плеере внизу'));
}

async function save(id,f,btn){
  const href=url(id,f.name),fname=f.name.split('/').pop();
  if(isNative()){
    try{
      await Capacitor.Plugins.Downloader.download({url:href,fileName:fname});
      toast('Загрузка началась. Файл появится в папке Музыка/FreeMusic.');
    }catch(e){toast('Не удалось начать загрузку: '+(e.message||e))}
    return;
  }
  const old=btn.textContent;btn.textContent='Загрузка…';btn.disabled=true;
  try{
    const r=await fetch(href);
    if(!r.ok)throw new Error(r.status);
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    toast('Файл сохранён: '+fname);
  }catch(e){
    window.open(href,'_blank','noopener');
    toast('Открыл файл в новой вкладке — сохраните его оттуда.');
  }finally{btn.textContent=old;btn.disabled=false}
}

function render(docs){
  const list=$('#list');list.innerHTML='';
  docs.forEach(d=>{
    const el=document.createElement('article');el.className='item';
    el.innerHTML=`<h3>${esc(d.title)}</h3>
      <div class="meta">${esc([].concat(d.creator||'Неизвестный исполнитель').join(', '))}</div>
      <div class="lic">${licName(d.licenseurl)}</div>
      <div class="row"><button class="btn best" type="button">Показать треки</button>
      <a class="btn" target="_blank" rel="noopener" href="https://archive.org/details/${encodeURIComponent(d.identifier)}">Страница</a></div>
      <div class="files" hidden></div>`;
    const btn=el.querySelector('button'),box=el.querySelector('.files');
    let loaded=false;
    btn.onclick=async()=>{
      if(loaded){box.hidden=!box.hidden;return}
      btn.textContent='Загрузка…';btn.disabled=true;
      try{
        const tracks=await loadTracks(d.identifier);
        loaded=true;btn.textContent='Скрыть / показать треки';box.hidden=false;
        if(!tracks.length){box.textContent='Аудиофайлы не найдены.';return}
        box.innerHTML='';
        tracks.slice(0,60).forEach(t=>{
          const row=document.createElement('div');row.className='file';
          const best=t.files[0];
          row.innerHTML=`<div class="t">${esc(t.title)}</div><div class="row"></div>`;
          const r=row.querySelector('.row');
          const pb=document.createElement('button');pb.className='btn';pb.type='button';pb.textContent='▶ Слушать';
          pb.onclick=()=>play(d.identifier,t);r.appendChild(pb);
          t.files.forEach((f,i)=>{
            const b=document.createElement('button');b.type='button';
            b.className='btn'+(i===0?' best':'');
            b.textContent=(i===0?'Скачать ':'')+LABEL[f.format]+(f.size?' · '+size(f.size):'');
            b.onclick=()=>save(d.identifier,f,b);r.appendChild(b);
          });
          box.appendChild(row);
        });
        if(tracks.length>60){const more=document.createElement('div');more.className='meta';more.textContent='Показаны первые 60 треков. Остальные — на странице альбома.';box.appendChild(more)}
      }catch(e){btn.textContent='Показать треки';toast('Не удалось загрузить треки: '+e.message)}
      finally{btn.disabled=false}
    };
    list.appendChild(el);
  });
}

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=$('#q').value.trim();if(!q)return;
  $('#status').textContent='Ищу…';$('#list').innerHTML='';
  try{
    const docs=await search(q,$('#fmt').value);
    $('#status').textContent=docs.length?`Найдено: ${docs.length}. Лучшее качество выделено цветом.`:'Ничего не найдено. Попробуйте другой запрос или слова на английском.';
    render(docs);
  }catch(err){
    $('#status').textContent='Ошибка поиска: '+err.message+'. Проверьте подключение к интернету.';
  }
});

// Установка как приложения (браузер) и офлайн-оболочка
let deferred;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>{$('#inst').hidden=true});
if(!isNative()&&'serviceWorker' in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
